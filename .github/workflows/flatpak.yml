name: Flatpak

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatter:
    name: Flatter
    runs-on: "ubuntu-24.04"
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged

    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false
      # Only one job at a time can use the shared repository cache
      max-parallel: 1

    steps:
      # Checkout a repository with Flatpak manifests
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup GPG
        if: ${{ github.triggering_actor == github.repository_owner }}
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install runtimes (x86_64)
        run: |
          flatpak install --noninteractive org.freedesktop.Sdk/x86_64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.mingw-w64/x86_64/25.08

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            com.valvesoftware.Steam.Utility.Spout2PW.yml
          arch: x86_64
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-bundles: true
          upload-pages-artifact: true
          upload-pages-includes: |
            default.css
            index.html

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
