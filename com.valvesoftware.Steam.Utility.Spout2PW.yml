id: com.valvesoftware.Steam.Utility.Spout2PW
runtime: com.valvesoftware.Steam
runtime-version: stable
branch: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
appstream-compose: false
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64
build-options:
  strip: true
  prefix: /app/utils/Spout2PW
  append-path: /usr/lib/sdk/mingw-w64/bin:/usr/lib/sdk/mingw-w64/x86_64-w64-mingw32/bin/
modules:
  - name: vulkan-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app/utils/Spout2PW
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/Vulkan-Headers/archive/v1.3.297/Vulkan-Headers-v1.3.297.tar.gz
        sha256: 1d679e2edc43cb7ad818b81dea960e374f1d6dd082325eb9b4c6113e76263c02
  - name: spout2pw
    buildsystem: simple
    build-options:
      strip: true
      prepend-path: /run/build/spout2pw/wine/bin
      env:
        LDFLAGS: "-Wl,--allow-shlib-undefined"
        CFLAGS: "-fno-stack-protector -I/app/utils/Spout2PW/include"
        CXXFLAGS: "-fno-stack-protector -I/app/utils/Spout2PW/include"
    build-commands:
      - |
        meson setup build-pw subprojects/pipewire-static \
        -Dprefix=${FLATPAK_DEST} \
        -Dexamples=disabled \
        -Dtests=disabled \
        -Dgstreamer=disabled \
        -Dlibsystemd=disabled \
        -Dlogind=disabled \
        -Dselinux=disabled \
        -Dpipewire-alsa=disabled \
        -Dpipewire-jack=disabled \
        -Dpipewire-v4l2=disabled \
        -Dspa-plugins=enabled \
        -Dudev=disabled \
        -Dsdl2=disabled \
        -Dv4l2=disabled \
        -Dalsa=disabled \
        -Dx11=disabled \
        -Dlibffado=disabled \
        -Dsnap=disabled \
        -Dopus=disabled \
        -Dreadline=disabled \
        -Dgsettings=disabled \
        -Dsession-managers='[]' \
        -Ddefault_library=static \
        -Djack=disabled \
        -Davahi=disabled \
        -Draop=disabled \
        -Davb=disabled \
        -Dlibpulse=disabled \
        -Dflatpak=disabled \
        -Dsupport=enabled \
        -Dstatic=true \
        -Dlibdir=lib
      - ninja -C build-pw
      - ninja -C build-pw install
      - ninja -C build-pw
      - ninja -C build-pw install
      - |
        cat > native.txt <<EOF
        [built-in options]
        pkg_config_path='${FLATPAK_DEST}/lib/pkgconfig'
        EOF
      - |
        meson setup \
        --native-file native.txt --cross-file misc/x86_64-w64-mingw32.txt \
        -Dlibpipewire_static_lib=${FLATPAK_DEST}/lib/libpipewire-static-0.3.a \
        -Dlibpipewire_static=true build .
      - ninja -C build install
      - |
        meson setup \
        --native-file native.txt --cross-file misc/x86_64-w64-mingw32.txt \
        -Dlibpipewire_static=false  dynbuild .
      - ninja -C dynbuild install
      - mkdir -p ${FLATPAK_DEST}/share/spout2pw
      - cp -a build/pkg/* ${FLATPAK_DEST}/share/spout2pw/
      - chmod +x ${FLATPAK_DEST}/share/spout2pw/spout2pw.sh
      - mkdir -p ${FLATPAK_DEST}/bin
      - ln -sf ../share/spout2pw/spout2pw.sh ${FLATPAK_DEST}/bin/spout2pw
    post-install:
      - install -Dpm0644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    cleanup:
      - /bin/spa*
      - /include
      - /lib
      - /etc
    sources:
      - type: git
        url: https://github.com/tasokait/spout2pw.git
        tag: 0.3.0
        commit: 357a92ea3f35b3216721519f17a0b540b5d4598b
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^([\d.]+)$
      - type: archive
        url: https://master.dl.sourceforge.net/project/wine/Slackware%20Packages/11.0/x86_64/wine-11.0-x86_64-1sg.txz
        sha256: 5a57406ffffff71337da0e69b8ef36d64be18055911a50ce32b202d8d9e5218e
        dest: wine
      - type: file
        path: com.valvesoftware.Steam.Utility.Spout2PW.metainfo.xml
      - type: patch
        path: flatpak-runtime.patch
