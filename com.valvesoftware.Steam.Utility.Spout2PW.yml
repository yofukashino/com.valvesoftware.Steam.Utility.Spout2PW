id: com.valvesoftware.Steam.Utility.Spout2PW
runtime: com.valvesoftware.Steam
runtime-version: stable
branch: stable
sdk: org.freedesktop.Sdk//25.08
build-extension: true
appstream-compose: false
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64
build-options:
  strip: true
  prefix: /app/utils/Spout2PW
  append-path: /usr/lib/sdk/mingw-w64/bin:/usr/lib/sdk/mingw-w64/x86_64-w64-mingw32/bin/
modules:
  - name: libdrm
    buildsystem: meson
    config-opts:
      - -Dintel=enabled
      - -Dradeon=enabled
      - -Damdgpu=enabled
      - -Dnouveau=disabled
      - -Dvmwgfx=disabled
      - -Domap=disabled
      - -Dexynos=disabled
      - -Dfreedreno=disabled
      - -Dtegra=disabled
      - -Dvc4=disabled
      - -Detnaviv=disabled
      - -Dcairo-tests=disabled
      - -Dvalgrind=disabled
      - -Dudev=false
    sources:
      - type: archive
        url: https://dri.freedesktop.org/libdrm/libdrm-2.4.133.tar.xz
        sha256: fc68f9d0ba2ea63c9432a299e14fea09fad7a8a66e8039fcd7802ca59f77b4f5
  - name: spout2pw
    buildsystem: simple
    build-options:
      strip: true
      prepend-path: /run/build/spout2pw/wine/bin
      env:
        LDFLAGS: ""
    build-commands:
      - chmod +x build.sh
      - ./build.sh
      - mkdir -p ${FLATPAK_DEST}/share/spout2pw
      - cp -a build/pkg/* ${FLATPAK_DEST}/share/spout2pw/
      - chmod +x ${FLATPAK_DEST}/share/spout2pw/spout2pw.sh
      - mkdir -p ${FLATPAK_DEST}/bin
      - ln -sf ../share/spout2pw/spout2pw.sh ${FLATPAK_DEST}/bin/spout2pw
    post-install:
      - install -Dpm0644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/hoshinolina/spout2pw.git
        tag: 0.2.3
        commit: 13380d5ffce3688669df485e6b703975665d75a0
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^([\d.]+)$
      - type: archive
        url: https://master.dl.sourceforge.net/project/wine/Slackware%20Packages/11.0/x86_64/wine-11.0-x86_64-1sg.txz
        sha256: 5a57406ffffff71337da0e69b8ef36d64be18055911a50ce32b202d8d9e5218e
        dest: wine
      - type: file
        path: com.valvesoftware.Steam.Utility.Spout2PW.metainfo.xml
      - type: patch
        path: flatpak-runtime.patch
